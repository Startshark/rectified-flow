base_channels: 64  # base_channels大一些有好处
epochs: 50 # 训练多少个epoch
batch_size: 64  # batch_size（推荐64或128，训练速度更快且稳定）
lr_adjust_epoch: 25 # 学习率调整的epoch，降为原有的10%
batch_print_interval: 100 # 打印间隔，以batch为单位
checkpoint_save_interval: 10 # 模型保存与采样间隔，以epoch为单位
outputs_root: './outputs'  # 输出主目录，内部自动创建带时间戳的实验文件夹
use_cfg: True  # 是否使用classifier-free guidance，开启就可以训练条件生成模型了
device: 'cuda' # cuda、cpu、mps(only macbook)

# 采样评估参数（每个checkpoint自动采样）
sample_steps: 20 # 采样生成图片的Euler迭代步数（10~20步速度极快且效果优秀）
sample_cfg_scale: 5.0 # CFG采样引导系数
sample_num_per_class: 1 # 每个数字类别的采样图片数量（设为1即0~9各1张，每次checkpoint只采样10张）

# Weights & Biases (W&B) 在线日志同步
use_wandb: true # 是否自动上传至 wandb（改为 true 或运行时加 --wandb 参数开启）
wandb_project: 'rectified-flow' # wandb 项目名
wandb_run_name: null # 自定义运行名称（留空则自动按时间戳命名）